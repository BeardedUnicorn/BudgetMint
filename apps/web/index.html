<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BudgetMint</title>
    <meta
      name="description"
      content="A bill tracker and cash-flow forecast, and TaskMint's companion: your bills, your TaskMint payouts, and what's left."
    />
    <link rel="canonical" href="https://budgetmint.web.app/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#65D6A1" />

    <!-- Installing it: the manifest (Android, desktop browsers) and the home screen on iOS -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BudgetMint" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BudgetMint" />
    <meta property="og:title" content="BudgetMint" />
    <meta
      property="og:description"
      content="A bill tracker and cash-flow forecast, and TaskMint's companion: your bills, your TaskMint payouts, and what's left."
    />
    <meta property="og:url" content="https://budgetmint.web.app/" />
    <meta property="og:image" content="https://budgetmint.web.app/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BudgetMint: your bills, your TaskMint payouts, and what's left" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The splash, until the app first draws (core's wasm and Firebase load
         first): React replaces #root's contents. Inline, as firebase.json's
         CSP allows for styles; the colours are the theme's backgrounds. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        background: #fafafa;
      }
      #splash > * {
        animation: splash-in 0.3s ease-out 0.15s both;
      }
      #splash img {
        width: 88px;
        height: 88px;
      }
      #splash .bar {
        width: 120px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(101, 214, 161, 0.25);
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #65d6a1;
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #121212;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash > *,
        #splash .bar::after {
          animation: none;
        }
        #splash .bar::after {
          width: 100%;
        }
      }
      .noscript {
        max-width: 28rem;
        margin: 20vh auto 0;
        padding: 0 24px;
        font: 1rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
    </style>
    <noscript>
      <style>
        #splash {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading BudgetMint">
        <img src="/budgetmint-icon.png" alt="" width="88" height="88" />
        <div class="bar"></div>
      </div>
    </div>
    <noscript>
      <p class="noscript">
        BudgetMint needs JavaScript. Turn it on for this site, then reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
