[package]
name = "budgetmint"
version = "1.0.1"
description = "BudgetMint for the desktop and Android"
authors = ["Mike Herold"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib's name apart from the bin's (a Windows issue:
# https://github.com/rust-lang/cargo/issues/8519)
name = "budgetmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
# Google sign-in (google_sign_in.rs, as TaskMint's): the token exchange, the
# PKCE challenge, and the random verifier and state
base64 = "0.22"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# A mock app, so the tests can call `dispatch` as the webview does
tauri = { version = "2.12", features = ["test"] }

# Desktop only (Tauri's `desktop` cfg): a phone has no second instance to
# forward to and no updater
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
# Open at login (Settings → Reminders), started hidden in the tray
tauri-plugin-autostart = "2.7"
# The window's size and position, kept between launches
tauri-plugin-window-state = "2.5"

# Only a phone or tablet sets notifications for the system to show later: the
# time one fires at, as the notification plugin takes it (platform/os.rs)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
time = "0.3"
