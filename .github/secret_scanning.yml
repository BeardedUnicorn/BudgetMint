# Secret scanning skips these files. They hold only Firebase client config,
# whose API keys are public by design: every build ships them to its users,
# and each project's rules and API restrictions are what protect the data.
# Nothing would flag a real secret put here, so keep real secrets out.
paths-ignore:
  - "apps/web/src/firebaseConfig.ts"
  - "apps/desktop/src/firebaseConfig.ts"
  - "apps/desktop/src-tauri/gen/android/app/google-services.json"
  - "apps/desktop/src-tauri/gen/android/app/firebase/google-services.*.json"
