# Weekly update pull requests for the GitHub Actions (pinned by commit in
# .github/workflows), the Rust crates and the npm packages. Minor and patch
# updates come grouped, one pull request per ecosystem; a major one comes on
# its own. CI checks each like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Tauri's crates move with its npm packages (below)
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # By hand: the wasm-bindgen CLI the workflows install must be the
      # version in Cargo.lock (scripts/check-toolchains.mjs)
      - dependency-name: wasm-bindgen

  # pnpm-workspace.yaml's catalog keeps TaskMint's versions, so the two apps
  # move together: take an update in TaskMint too
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]
