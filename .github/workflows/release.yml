# Adapted from TaskMint .github/workflows/release.yml @ 1623bee.
name: Release

# A vX.Y.Z tag (pushed by `pnpm release publish`) builds every file a release
# ships and creates the GitHub release with the version's CHANGELOG section.
# Manual runs, and pull requests that change how releases are built, build the
# same files as workflow artifacts and publish nothing.
#
# The desktop builds also make the app's signed updates, with the key in the
# TAURI_SIGNING_PRIVATE_KEY secret, and the release gets the latest.json that
# installed apps check for updates (the README's "Desktop updates"). The
# Android APK is signed with the release key in the ANDROID_KEYSTORE secret,
# so each one installs over the one before (the README's "Android signing").
#
# The release also gets SHA256SUMS, the checksums of every file it ships.
#
# The web app is built too, and a tag deploys it to Firebase Hosting (the
# budgetmint site in BudgetMint's budgetmint project) with BudgetMint's
# Firestore rules (rules/firestore.rules) once every build has passed, when
# the repository has the Workload Identity Federation variables. TaskMint's
# project and its rules are TaskMint's, deployed from TaskMint. The GitHub
# release waits for the web build, not the deploy, so a failed deploy can be
# re-run on its own.
#
# Everything here is built for production (BUDGETMINT_ENV=production:
# release.mjs sets it for its builds, and the web job below): any other build
# is a dev build, on the budgetmint-dev and taskmint-dev Firebase projects
# (ADR 0005, the README's "Dev environment").
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.mjs
      - scripts/release/**
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.production.conf.json
      - apps/desktop/src-tauri/tauri.updater.conf.json
      - apps/desktop/src-tauri/tauri.android.conf.json
      - apps/desktop/src-tauri/gen/android/**
      # What the desktop builds compile, so a change that breaks the Windows
      # build fails on its pull request
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - firebase.json
      - rules/firestore.rules
      - scripts/build-wasm.mjs
      - scripts/environment.mjs
      - scripts/check-web-environment.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned to a commit, with the version alongside;
# Dependabot keeps them current (.github/dependabot.yml)
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # desktop: the targets that make the app's updates
        include:
          - target: macos-arm64
            os: macos-26
            desktop: true
          # Cross-compiled on Apple silicon (scripts/release/lib.mjs buildPlan)
          - target: macos-x64
            os: macos-26
            desktop: true
          - target: windows-x64
            os: windows-2025
            desktop: true
          # The APK, signed with the release key (no updates: it's sideloaded)
          - target: android-arm64
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # A release without updates would leave installed apps where they are
      - name: The updates can be signed
        if: github.ref_type == 'tag' && matrix.desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so the updates can't be signed (the README's \"Desktop updates\")"
            exit 1
          fi

      # Without its OAuth client the desktop hides Google sign-in, so a
      # release would quietly lose it
      - name: The desktop can sign in with Google
        if: github.ref_type == 'tag' && matrix.desktop
        shell: bash
        env:
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$VITE_GOOGLE_DESKTOP_CLIENT_ID" ] || [ -z "$VITE_GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            echo "::error::The VITE_GOOGLE_DESKTOP_CLIENT_ID and VITE_GOOGLE_DESKTOP_CLIENT_SECRET secrets aren't both set, so the desktop would have no Google sign-in (the README's \"Firebase setup\")"
            exit 1
          fi

      # Windows checks out LF line ends too, so every build has the same files
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency caches: a release is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: The tag is the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but apps/desktop/package.json says $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The version and components in rust-toolchain.toml, with the wasm target
      - run: rustup toolchain install

      # Core runs in every app's webview: the release script builds its wasm
      # first, with the wasm-bindgen CLI Cargo.lock pins (check-toolchains)
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.127

      # The APK: a JDK for Gradle, and the Android SDK with the same NDK as a
      # local build (the README's "Android"). Gradle fetches the SDK Platform
      # and Build-Tools it needs.
      - if: matrix.target == 'android-arm64'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;29.0.13599879
          log-accepted-android-sdk-licenses: false

      - if: matrix.target == 'android-arm64'
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13599879" >> "$GITHUB_ENV"

      # Every APK is signed with the release key, so it installs over the
      # last one; the build step checks the certificate too.
      - name: The APK can be signed
        if: matrix.target == 'android-arm64'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE secret isn't set, so the APK can't be signed (the README's \"Android signing\")"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/budgetmint-release.p12"
          echo "BUDGETMINT_ANDROID_KEYSTORE=$RUNNER_TEMP/budgetmint-release.p12" >> "$GITHUB_ENV"

      - run: node scripts/release.mjs --rebuild --target ${{ matrix.target }}
        env:
          # The desktop's Google sign-in client; without it, the desktop signs
          # in to cloud sync by email only
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ matrix.desktop && secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID || '' }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ matrix.desktop && secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
          # Signs the desktop builds' updates (only this step sees the key; the
          # APK has no updates)
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.desktop && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.desktop && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # The release key's password, for the APK only
          BUDGETMINT_ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android-arm64' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: releases/
          if-no-files-found: error

  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # BudgetMint's rules in WebAssembly: the Rust toolchain with its wasm
      # target, and the wasm-bindgen CLI Cargo.lock pins (check-toolchains)
      - run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.127

      - run: pnpm build:wasm

      - run: pnpm --filter @budgetmint/web build
        env:
          BUDGETMINT_ENV: production

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/web/dist/
          if-no-files-found: error

  deploy-web:
    name: Deploy the web app
    # Skipped when the repository lacks either variable (the README's
    # "Firebase setup" names the provider and the service account)
    if: >-
      github.ref_type == 'tag' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    needs: [build, web]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # The GitHub OIDC token Google's Workload Identity Federation takes
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps/web/dist

      # No stored key: the provider should trust this repository's v* tags
      # only, as a service account that can deploy Hosting and the Firestore
      # rules, and nothing more
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # firebase-tools at the version package.json's "firebase" script pins.
      # The rules first, so a release's new kinds of documents are allowed by
      # the time its web app is served. Hosting's predeploy
      # (scripts/check-web-environment.mjs) refuses a dist that wasn't built
      # for this project.
      - run: pnpm firebase deploy --only firestore:rules --project budgetmint --non-interactive
      - run: pnpm firebase deploy --only hosting --project budgetmint --non-interactive

  github-release:
    if: github.ref_type == 'tag'
    # The web build too: a release whose web app doesn't build isn't made
    needs: [build, web]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: releases
          merge-multiple: true

      - run: node scripts/release.mjs github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
