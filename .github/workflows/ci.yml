name: CI

on:
  push:
    branches: [main]
  pull_request:

# It only reads the code: nothing is pushed, released or commented on
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the app's primary platform, and no extra WebKitGTK system
    # packages are needed to compile the Tauri crate.
    runs-on: macos-26
    # A run takes 5 to 15 minutes; a cold cache builds Tauri twice (the
    # tests, then the coverage)
    timeout-minutes: 45
    # The actions are pinned to a commit, with the version alongside;
    # Dependabot keeps them current (.github/dependabot.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version and components in rust-toolchain.toml, with the wasm
      # target (rustup no longer installs it on first use)
      - run: rustup toolchain install

      # The wasm-bindgen CLI, the version Cargo.lock has (check-toolchains
      # reads it here)
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.127

      # The Rust coverage gates
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The Firestore emulator needs Java 21 or later
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Every gate a change must pass, in scripts/verify.sh: CI runs the
      # same script as a merge does locally, so the two can't drift
      - run: pnpm verify
